kind = "mobile"
previewPath = "/mobile/"
title = "Quikkk Mobile"
version = "1.0.0"
id = "artifacts/quikkk-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18274

[services.development]
run = "pnpm --filter @workspace/quikkk-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quikkk-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/quikkk-mobile", "run", "serve" ]

[services.env]
PORT = "18274"
BASE_PATH = "/mobile/"
